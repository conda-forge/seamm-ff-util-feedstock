{% set name = "seamm-ff-util" %}
{% set version = "2026.9.25" %}
{% set sha256 = "70674276b634b68b03c7a2c34458b5bc706c045ea182df20cf85d628043d6f1d" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/seamm-ff-util/seamm_ff_util-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - molsystem
    - numpy
    - packaging
    - python >={{ python_min }}
    - seamm-util
    - sympy
    - tabulate

test:
  imports:
    - numpy
    - seamm_ff_util
    - sympy
    - tabulate
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/molssi-seam/seamm_ff_util
  summary: Utilities for handling forcefields in the SEAMM environment.
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://molssi-seamm.github.io/seamm_ff_util/

extra:
  recipe-maintainers:
    - paulsaxe
