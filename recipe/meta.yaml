{% set name = "seamm-ff-util" %}
{% set version = "2025.4.7" %}
{% set sha256 = "b675f22cee78c665de579846deec266148b11c10b2d617c081fdc64d44b66c22" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/seamm-ff-util/seamm_ff_util-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - molsystem
    - numpy
    - packaging
    - python >={{ python_min }}
    - seamm-util
    - sympy
    - tabulate

test:
  imports:
    - numpy
    - seamm_ff_util
    - sympy
    - tabulte
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/molssi-seam/seamm_ff_util
  summary: Utilities for handling forcefields in the SEAMM environment.
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://molssi-seamm.github.io/seamm_ff_util/

extra:
  recipe-maintainers:
    - paulsaxe
